    </p>

<style>

  border-top-right-radius: 12px;
  border-top-left-radius: 12px;
  box-shadow: 45px;
  padding: 1.5rem 2rem;

.footer-inner {

  align-items: center;
  justify-content: center;

.copy-symbol {

  font-size: 1.2rem;

}

.copy-company {

  font-weight: 500;
  letter-spacing: 0.3px;
}

.copy-rights {

  font-size: 0.85rem;
}
