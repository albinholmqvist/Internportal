<meta charset="UTF-8" /><title>Avtalskatalog</title>
<div>
  <h1 style="margin-bottom: 10px;">Avtalskatalog</h1>
  <button onclick="loadContracts()" class="btn" style="background-image: initial; background-position-x: initial; background-position-y: initial; background-size: initial; background-repeat: initial; background-attachment: initial; background-origin: initial; background-clip: initial; background-color: rgb(45, 137, 239); color: white; padding-top: 8px; padding-right: 12px; padding-bottom: 8px; padding-left: 12px; border-top-width: medium; border-right-width: medium; border-bottom-width: medium; border-left-width: medium; border-top-style: none; border-right-style: none; border-bottom-style: none; border-left-style: none; border-top-color: currentcolor; border-right-color: currentcolor; border-bottom-color: currentcolor; border-left-color: currentcolor; border-image-source: none; border-image-slice: 100%; border-image-width: 1; border-image-outset: 0; border-image-repeat: stretch; border-top-left-radius: 6px; border-top-right-radius: 6px; border-bottom-right-radius: 6px; border-bottom-left-radius: 6px; cursor: pointer;">Hämta avtal</button><input type="text" id="search" placeholder="Sök avtal, leverantör eller avtalsnummer..." onkeyup="filterContracts()" style="width: 100%; padding-top: 12px; padding-right: 12px; padding-bottom: 12px; padding-left: 12px; margin-bottom: 20px; font-size: 16px;" />
  <div id="contracts"></div>
  <script>
    let allContracts = [];

    async function loadContracts() {
        const url = "https://reqres.in/api/collections/contracts/records";

        try {
            const response = await fetch(url, {
                method: "GET",
                headers: {
                    "x-api-key": "pub_1ab25935af3971c4ab995c2fc3399dd4",
                    "Content-Type": "application/json"
                }
            });

            const text = await response.text();
            let data;

            try {
                data = JSON.parse(text);
            } catch (e) {
                console.error("Not JSON:", text);
                document.getElementById("contracts").innerHTML =
                    "<p style='color:red;'>API-svaret är inte JSON.</p>";
                return;
            }

            allContracts = data.data || [];
            renderContracts(allContracts);
        }
        catch (err) {
            console.error(err);
            document.getElementById("contracts").innerHTML =
                "<p style='color:red;'>Misslyckades att hämta avtal.</p>";
        }
    }

    function renderContracts(records) {
        const container = document.getElementById("contracts");
        container.innerHTML = "";

        if (!records.length) {
            container.innerHTML = "<p>Inga avtal hittades.</p>";
            return;
        }

        records.forEach((r, i) => {
            const areaPreview =
                r.service_content && typeof r.service_content === "string"
                ? r.service_content.substring(0, 60)
                : "—";

            const div = document.createElement("div");
            div.className = "record";

            div.innerHTML = `
                <h3>${r.contract_name || "Namnlöst avtal"}</h3>

                <div class="overview">
                    <strong>Leverantör:</strong> ${r.supplier || "–"}<br>
                    <strong>Avtalsperiod:</strong> ${r.contract_period || "–"}<br>
                    <strong>Område:</strong> ${areaPreview}...
                </div>

                <button class="btn" onclick="toggleDetails(${i})">Visa mer</button>

                <div class="details" id="details-${i}">
                    <p><strong>Kontaktperson:</strong> ${r.contact_person || "–"}</p>
                    <p><strong>Avtalsnummer:</strong> ${r.contract_number || "–"}</p>
                    <p><strong>Tjänsteinnehåll:</strong> ${r.service_content || "–"}</p>
                    <p><strong>Bilagor:</strong><br>
                        ${
                            Array.isArray(r.attachments)
                                ? r.attachments.map(a => `📎 ${a}`).join("<br>")
                                : "–"
                        }
                    </p>
                </div>
            `;

            container.appendChild(div);
        });
    }

    function toggleDetails(index) {
        const el = document.getElementById("details-" + index);
        el.style.display = el.style.display === "block" ? "none" : "block";
    }

    function filterContracts() {
        const q = document.getElementById("search").value.toLowerCase();

        const filtered = allContracts.filter(r =>
            (r.contract_name || "").toLowerCase().includes(q) ||
            (r.supplier || "").toLowerCase().includes(q) ||
            (r.contract_number || "").toLowerCase().includes(q)
        );

        renderContracts(filtered);
    }
  </script>
</div>
<div class="row sectionBlockLayout text-start" style="display: flex; flex-wrap: wrap; margin: 0px; min-height: auto; padding: 8px;">
  <div class="container" style="padding: 0px; display: flex; flex-wrap: wrap;"><div class="col-lg-12 columnBlockLayout" style="flex-grow: 1; display: flex; flex-direction: column; min-width: 250px;"></div></div>
</div>
